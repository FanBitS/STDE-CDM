[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stde-cdm"
version = "1.0.0"
description = "Spatiotemporal dual expert conditional diffusion for synchronized multisite wind scenarios"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jiayue Sun"},
  {name = "Guangyu Fan"},
  {name = "Zhongyang Ming"},
  {name = "Yu Shan"},
]
keywords = [
  "wind power",
  "scenario generation",
  "conditional diffusion",
  "probabilistic forecasting",
  "distributionally robust optimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.1",
  "UMNN>=1.71",
]

[project.optional-dependencies]
dispatch = [
  "gurobipy>=13.0",
  "pandapower==3.5.4",
]
plot = [
  "seaborn>=0.13",
]
test = [
  "pytest>=8",
]
notebook = [
  "jupyterlab>=4",
]

[project.urls]
Repository = "https://github.com/FanBitS/STDE-CDM"
Issues = "https://github.com/FanBitS/STDE-CDM/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
